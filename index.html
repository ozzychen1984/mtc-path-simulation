<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTC機器人路徑模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: none; 
            margin: 0 auto;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        #simulationCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none; /* 防止觸控螢幕滾動與縮放 */
        }
        
        .controls-panel {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="p-2 md:p-4">

    <div class="max-w-[98%] mx-auto grid grid-cols-1 xl:grid-cols-4 gap-6 items-start">
        
        <!-- 左側/上方：畫布區域 -->
        <div class="xl:col-span-3 flex flex-col gap-4">
            <div class="flex flex-wrap justify-between items-center gap-2">
                <h1 class="text-2xl font-bold text-gray-800">MTC機器人路徑模擬器</h1>
                <div class="flex flex-wrap gap-2">
                    <button id="exportBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded shadow transition duration-200">
                        匯出紀錄
                    </button>
                    <label for="importUpload" class="cursor-pointer bg-teal-500 hover:bg-teal-600 text-white font-semibold py-2 px-4 rounded shadow transition duration-200">
                        匯入紀錄
                        <input type="file" id="importUpload" accept=".json" class="hidden">
                    </label>
                    <label for="mapUpload" class="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow transition duration-200">
                        上傳場地圖
                        <input type="file" id="mapUpload" accept="image/*" class="hidden">
                    </label>
                    <button id="resetBtn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded shadow transition duration-200">
                        重置位置
                    </button>
                </div>
            </div>
            
            <div class="canvas-container w-full" id="canvasContainer">
                <canvas id="simulationCanvas"></canvas>
            </div>
            
        </div>

        <!-- 右側/下方：資訊面板 -->
        <div class="xl:col-span-1 flex flex-col gap-3">
            
            <!-- 場地設定 -->
            <div class="controls-panel p-3">
                <h2 class="text-lg font-bold text-gray-800 mb-2 border-b pb-1">場地設定 <span class="text-xs font-normal text-gray-500">(每格固定為 20x20 公分)</span></h2>
                <div class="flex items-end gap-2">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-600 font-medium mb-1">寬度</label>
                        <input type="number" id="gridColsInput" value="15" min="5" max="50" class="w-full border rounded p-1.5 focus:ring focus:ring-blue-200 text-center text-sm">
                    </div>
                    <span class="mb-1.5 text-gray-500 font-bold">×</span>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-600 font-medium mb-1">長度</label>
                        <input type="number" id="gridRowsInput" value="15" min="5" max="50" class="w-full border rounded p-1.5 focus:ring focus:ring-blue-200 text-center text-sm">
                    </div>
                    <button id="applyFieldBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold py-1.5 px-3 rounded shadow transition duration-200">
                        套用
                    </button>
                </div>
            </div>

            <!-- 場地道具設定 -->
            <div class="controls-panel p-3">
                <h2 class="text-lg font-bold text-gray-800 mb-2 border-b pb-1">場地道具設定</h2>
                
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <button id="addYellowBtn" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-xs font-semibold py-1.5 rounded shadow transition">
                        + 黃正方<br><span class="text-[10px] font-normal">(14x14)</span>
                    </button>
                    <button id="addBlueBtn" class="bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold py-1.5 rounded shadow transition">
                        + 藍長方<br><span class="text-[10px] font-normal">(30x5)</span>
                    </button>
                    <button id="addRedBtn" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold py-1.5 rounded shadow transition">
                        + 紅圓球<br><span class="text-[10px] font-normal">(ø5)</span>
                    </button>
                </div>

                <div class="flex justify-between items-center mt-2">
                    <span class="text-xs text-gray-600">已選取：<span id="selectedObjType" class="font-bold text-gray-800">無</span></span>
                    <button id="deleteObjBtn" disabled class="bg-gray-200 text-gray-500 py-1 px-2 rounded text-xs transition disabled:opacity-50 hover:bg-red-100 hover:text-red-600">
                        刪除選取
                    </button>
                </div>
            </div>

            <!-- 狀態與旋轉控制 -->
            <div class="controls-panel p-3">
                <h2 class="text-lg font-bold text-gray-800 mb-2 border-b pb-1">狀態與旋轉控制</h2>
                
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div class="bg-blue-50 p-2 rounded-lg border border-blue-100 flex items-center justify-center gap-1">
                        <span class="text-base text-blue-600 font-medium">X:</span>
                        <span id="coordX" class="text-lg font-bold text-blue-800">-</span>
                    </div>
                    <div class="bg-green-50 p-2 rounded-lg border border-green-100 flex items-center justify-center gap-1">
                        <span class="text-base text-green-600 font-medium">Y:</span>
                        <span id="coordY" class="text-lg font-bold text-green-800">-</span>
                    </div>
                    <div class="bg-purple-50 p-2 rounded-lg border border-purple-100 col-span-2">
                        <div class="flex items-center justify-between gap-2">
                            <span id="angleDisplay" class="text-lg font-bold text-purple-800 w-12 text-center">-</span>
                            <div class="flex gap-1">
                                <button id="rotateCCWBtn" class="bg-purple-200 hover:bg-purple-300 text-purple-800 font-bold py-1 px-2 rounded shadow transition text-xs">-90° ↶</button>
                                <button id="rotateCWBtn" class="bg-purple-200 hover:bg-purple-300 text-purple-800 font-bold py-1 px-2 rounded shadow transition text-xs">↷ +90°</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-xs text-gray-600 mt-2 space-y-1">
                    <p>• 機器車尺寸: 20x20cm (夾子9cm)</p>
                </div>
            </div>

            <!-- 動作控制按鈕區 (新位置) -->
            <div class="grid grid-cols-2 gap-2">
                <button id="setOriginBtn" class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-3 rounded shadow transition duration-200 text-sm">
                    設定(0,0)
                </button>
                <button id="recordBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 px-3 rounded shadow transition duration-200 text-sm">
                    記錄位置
                </button>
            </div>

            <!-- 路徑記錄 -->
            <div class="controls-panel p-3 flex flex-col">
                <div class="flex justify-between items-center mb-2 border-b pb-1">
                    <h2 class="text-lg font-bold text-gray-800">移動路徑記錄</h2>
                    <div class="flex gap-2">
                        <button id="playPathBtn" class="text-xs text-blue-600 hover:text-blue-800 transition font-bold">▶ 播放</button>
                        <button id="clearLogBtn" class="text-xs text-gray-500 hover:text-red-500 transition">清除記錄</button>
                    </div>
                </div>
                
                <div class="text-[10px] text-gray-400 mb-1">記錄數值為與上一點的相對位移 (ΔX, ΔY)</div>
                <div class="overflow-y-auto h-48 max-h-60 bg-gray-50 rounded border p-1.5 font-mono text-xs no-scrollbar" id="pathLog">
                    <div class="text-gray-400 italic text-center mt-2" id="emptyLogMsg">尚無移動記錄</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('simulationCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('canvasContainer');
            
            // 顯示元素
            const coordXDisplay = document.getElementById('coordX');
            const coordYDisplay = document.getElementById('coordY');
            const angleDisplay = document.getElementById('angleDisplay');
            const rotateCCWBtn = document.getElementById('rotateCCWBtn');
            const rotateCWBtn = document.getElementById('rotateCWBtn');
            const pathLog = document.getElementById('pathLog');
            let emptyLogMsg = document.getElementById('emptyLogMsg');
            const selectedObjTypeDisplay = document.getElementById('selectedObjType'); // Added this line
            
            // 按鈕
            const resetBtn = document.getElementById('resetBtn');
            const clearLogBtn = document.getElementById('clearLogBtn');
            const playPathBtn = document.getElementById('playPathBtn');
            const mapUpload = document.getElementById('mapUpload');
            const setOriginBtn = document.getElementById('setOriginBtn');
            const recordBtn = document.getElementById('recordBtn');
            const exportBtn = document.getElementById('exportBtn');
            const importUpload = document.getElementById('importUpload');
            const applyFieldBtn = document.getElementById('applyFieldBtn');

            // 道具新增與刪除按鈕
            const addYellowBtn = document.getElementById('addYellowBtn');
            const addBlueBtn = document.getElementById('addBlueBtn');
            const addRedBtn = document.getElementById('addRedBtn');
            const deleteObjBtn = document.getElementById('deleteObjBtn');

            // 場地設定
            const GRID_SIZE_CM = 20;
            let gridCols = 15;
            let gridRows = 15;
            let fieldWidthCM = gridCols * GRID_SIZE_CM;
            let fieldHeightCM = gridRows * GRID_SIZE_CM;

            // 機器車實體尺寸 (公分)
            const ROBOT_WIDTH_CM = 20;
            const ROBOT_HEIGHT_CM = 20;
            const CLAW_LENGTH_CM = 9;
            const CLAW_WIDTH_CM = 10;

            // 座標系統 (預設原點在右下角)
            let originX = fieldWidthCM;
            let originY = fieldHeightCM;
            let lastRecordX = originX;
            let lastRecordY = originY;

            // 物件與狀態陣列
            let robot = {
                id: 'robot',
                type: 'robot',
                x: fieldWidthCM / 2, 
                y: fieldHeightCM / 2,
                angle: 0
            };
            
            let fieldObjects = []; // 存放所有道具
            let selectedObject = robot; // 目前選取的物件
            let pathHistory = [];
            let scale = 1;

            // 滑鼠互動狀態
            let isDragging = false;
            let isRotating = false;
            let dragOffsetX = 0;
            let dragOffsetY = 0;

            // 播放動畫狀態
            let isPlaying = false;
            let playIndex = 0;
            let playStartTime = 0;

            // 載入地圖底圖
            const mapImage = new Image();
            mapImage.src = 'https://drive.google.com/uc?export=view&id=1RnXgU8fJPV1ZtCZiDIOuIzNfEf2LqG8a'; 
            mapImage.crossOrigin = "Anonymous";
            let imageLoaded = false;
            
            mapImage.onload = () => { imageLoaded = true; };
            mapImage.onerror = () => { console.log("底圖載入失敗，將使用純網格背景。"); };

            mapUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        mapImage.src = event.target.result;
                        mapImage.removeAttribute("crossOrigin"); 
                        imageLoaded = true;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // 畫布縮放
            function resizeCanvas() {
                container.style.aspectRatio = `${fieldWidthCM} / ${fieldHeightCM}`;
                const rect = container.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;

                const dpr = window.devicePixelRatio || 1;
                
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = `${rect.width}px`;
                canvas.style.height = `${rect.height}px`;
                
                ctx.scale(dpr, dpr);
                scale = rect.width / fieldWidthCM;
            }
            window.addEventListener('resize', resizeCanvas);

            // 監聽容器尺寸變化 (防止面板變動時影響畫布邊界)
            const resizeObserver = new ResizeObserver(() => {
                resizeCanvas();
            });
            resizeObserver.observe(container);

            // --- 幾何與碰撞偵測 ---
            // 根據不同物件定義邊界範圍與旋轉把手位置
            function getObjectBounds(obj) {
                if (obj.type === 'robot') {
                    return { 
                        left: -ROBOT_WIDTH_CM/2, right: ROBOT_WIDTH_CM/2, 
                        top: -ROBOT_HEIGHT_CM/2 - CLAW_LENGTH_CM, bottom: ROBOT_HEIGHT_CM/2, 
                        cx: 0, cy: -ROBOT_HEIGHT_CM/2 - CLAW_LENGTH_CM - 6 
                    };
                } else if (obj.type === 'yellow') {
                    // 定位在右下角，長寬 14
                    return { left: -14, right: 0, top: -14, bottom: 0, cx: -7, cy: -18 };
                } else if (obj.type === 'blue') {
                    // 定位在右下角，長 30 寬 5
                    return { left: -30, right: 0, top: -5, bottom: 0, cx: -15, cy: -12 };
                } else if (obj.type === 'red') {
                    // 定位在正中央，直徑 5
                    return { radius: 2.5, cx: 0, cy: -8 };
                }
            }

            function getLocalCoords(mx, my, obj) {
                const dx = mx - obj.x;
                const dy = my - obj.y;
                const angle = -obj.angle * Math.PI / 180;
                const lx = dx * Math.cos(angle) - dy * Math.sin(angle);
                const ly = dx * Math.sin(angle) + dy * Math.cos(angle);
                return { x: lx, y: ly };
            }

            function checkHit(mx, my, obj) {
                const local = getLocalCoords(mx, my, obj);
                const bounds = getObjectBounds(obj);

                // 檢查是否點擊到旋轉把手 (藍點)
                if (selectedObject === obj) {
                     const distToHandle = Math.hypot(local.x - bounds.cx, local.y - bounds.cy);
                     if (distToHandle <= 6) return 'handle'; 
                }

                // 檢查是否點擊本體
                if (bounds.radius) {
                     if (Math.hypot(local.x, local.y) <= bounds.radius) return 'body';
                } else {
                     if (local.x >= bounds.left && local.x <= bounds.right &&
                         local.y >= bounds.top && local.y <= bounds.bottom) {
                         return 'body';
                     }
                }
                return false;
            }

            function getEventCoords(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) / scale,
                    y: (e.clientY - rect.top) / scale
                };
            }

            // --- Pointer Events 控制 ---
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // 阻止瀏覽器預設行為
                
                // 如果正在播放，點擊畫布即中斷播放
                if (isPlaying) {
                    isPlaying = false;
                    playPathBtn.textContent = '▶ 播放';
                }

                const coords = getEventCoords(e);
                let hitSomething = false;

                // 檢查順序：先檢查機器車 (最上層)，再從最後加入的道具往前檢查
                const checkList = [robot, ...fieldObjects.slice().reverse()];

                for (let obj of checkList) {
                    const hitResult = checkHit(coords.x, coords.y, obj);
                    if (hitResult) {
                        selectedObject = obj;
                        hitSomething = true;
                        
                        if (hitResult === 'handle') {
                            isRotating = true; // 點到旋轉把手
                        } else if (hitResult === 'body') {
                            isDragging = true; // 點到物件本體
                            dragOffsetX = coords.x - obj.x;
                            dragOffsetY = coords.y - obj.y;
                        }
                        
                        try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
                        updateDisplays();
                        break; // 找到最上層碰觸到的物件就停止檢查
                    }
                }

                // 如果點擊空白處，取消選取狀態
                if (!hitSomething) {
                    selectedObject = null;
                    updateDisplays();
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                e.preventDefault();
                if (!selectedObject) return; // 沒有選取物件就不處理移動

                const coords = getEventCoords(e);
                
                if (isRotating) {
                    const dx = coords.x - selectedObject.x;
                    const dy = coords.y - selectedObject.y;
                    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    angle += 90; // 校正 (把手定義在物體的上方Y負方向)
                    selectedObject.angle = (angle + 360) % 360;
                    updateDisplays();
                } else if (isDragging) {
                    let newX = coords.x - dragOffsetX;
                    let newY = coords.y - dragOffsetY;
                    
                    if (selectedObject.id === 'robot') {
                        // 機器車保留場地邊界限制
                        const halfW = ROBOT_WIDTH_CM / 2;
                        const halfH = ROBOT_HEIGHT_CM / 2;
                        selectedObject.x = Math.max(halfW, Math.min(fieldWidthCM - halfW, newX));
                        selectedObject.y = Math.max(halfH + CLAW_LENGTH_CM, Math.min(fieldHeightCM - halfH, newY));
                    } else {
                        // 道具自由放置
                        selectedObject.x = newX;
                        selectedObject.y = newY;
                    }
                    updateDisplays();
                }
            });

            const cancelDrag = (e) => {
                e.preventDefault();
                isDragging = false;
                isRotating = false;
                try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
            };
            canvas.addEventListener('pointerup', cancelDrag);
            canvas.addEventListener('pointercancel', cancelDrag);

            // 按鈕角度控制 (-90度 與 +90度)
            rotateCCWBtn.addEventListener('click', () => {
                if (selectedObject) {
                    selectedObject.angle = (selectedObject.angle - 90 + 360) % 360;
                    updateDisplays();
                }
            });

            rotateCWBtn.addEventListener('click', () => {
                if (selectedObject) {
                    selectedObject.angle = (selectedObject.angle + 90) % 360;
                    updateDisplays();
                }
            });

            function getRelativeX(absX) { return absX - originX; }
            function getRelativeY(absY) { return originY - absY; }

            function updateDisplays() {
                // 狀態面板顯示目前選取物件的位置 (四捨五入整數)
                if (selectedObject) {
                    coordXDisplay.textContent = Math.round(getRelativeX(selectedObject.x));
                    coordYDisplay.textContent = Math.round(getRelativeY(selectedObject.y));
                    
                    angleDisplay.textContent = `${Math.round(selectedObject.angle)}°`;
                    
                    const nameMap = { 'robot': '機器車', 'yellow': '黃正方', 'blue': '藍長方', 'red': '紅圓球' };
                    selectedObjTypeDisplay.textContent = nameMap[selectedObject.type] || '未選擇';
                    deleteObjBtn.disabled = (selectedObject.id === 'robot');
                } else {
                    // 如果沒有選取任何物件，顯示 -
                    coordXDisplay.textContent = '-';
                    coordYDisplay.textContent = '-';
                    angleDisplay.textContent = `-`;
                    selectedObjTypeDisplay.textContent = '無';
                    deleteObjBtn.disabled = true;
                }
            }

            // 新增道具按鈕
            addYellowBtn.addEventListener('click', () => {
                const newObj = { id: Date.now(), type: 'yellow', x: fieldWidthCM/2, y: fieldHeightCM/2, angle: 0 };
                fieldObjects.push(newObj);
                selectedObject = newObj;
                updateDisplays();
            });
            addBlueBtn.addEventListener('click', () => {
                const newObj = { id: Date.now(), type: 'blue', x: fieldWidthCM/2, y: fieldHeightCM/2, angle: 0 };
                fieldObjects.push(newObj);
                selectedObject = newObj;
                updateDisplays();
            });
            addRedBtn.addEventListener('click', () => {
                const newObj = { id: Date.now(), type: 'red', x: fieldWidthCM/2, y: fieldHeightCM/2, angle: 0 };
                fieldObjects.push(newObj);
                selectedObject = newObj;
                updateDisplays();
            });

            // 刪除選取道具
            deleteObjBtn.addEventListener('click', () => {
                if (selectedObject && selectedObject.id !== 'robot') {
                    fieldObjects = fieldObjects.filter(obj => obj.id !== selectedObject.id);
                    selectedObject = null;
                    updateDisplays();
                }
            });

            // --- 繪圖邏輯 ---
            function draw() {
                const rect = canvas.getBoundingClientRect();
                ctx.clearRect(0, 0, rect.width, rect.height);
                ctx.save();
                
                drawField();
                drawPath();
                drawObjects();
                drawRobot();

                ctx.restore();
            }

            function drawField() {
                const rect = container.getBoundingClientRect();
                const drawW = rect.width;
                const drawH = rect.height;

                if (imageLoaded) {
                    ctx.drawImage(mapImage, 0, 0, drawW, drawH);
                } else {
                    ctx.fillStyle = '#f9fafb';
                    ctx.fillRect(0, 0, drawW, drawH);
                }

                // 永遠繪製網格線在最上層
                ctx.strokeStyle = 'rgba(107, 114, 128, 0.3)'; 
                ctx.lineWidth = 1;

                for (let x = 0; x <= fieldWidthCM; x += GRID_SIZE_CM) {
                    ctx.beginPath();
                    ctx.moveTo(x * scale, 0); ctx.lineTo(x * scale, drawH);
                    ctx.stroke();
                }
                for (let y = 0; y <= fieldHeightCM; y += GRID_SIZE_CM) {
                    ctx.beginPath();
                    ctx.moveTo(0, y * scale); ctx.lineTo(drawW, y * scale);
                    ctx.stroke();
                }

                // 畫原點 (紅十字)
                ctx.beginPath();
                ctx.strokeStyle = '#EF4444'; 
                ctx.lineWidth = 2;
                const ox = originX * scale;
                const oy = originY * scale;
                ctx.moveTo(ox - 12, oy); ctx.lineTo(ox + 12, oy);
                ctx.moveTo(ox, oy - 12); ctx.lineTo(ox, oy + 12);
                ctx.stroke();
                
                ctx.fillStyle = '#EF4444';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = originX > fieldWidthCM - 40 ? 'right' : 'left';
                ctx.textBaseline = originY < 20 ? 'top' : 'bottom';
                ctx.fillText('(0,0)', originX > fieldWidthCM - 40 ? ox - 8 : ox + 8, originY < 20 ? oy + 8 : oy - 8);
            }

            function drawSelectionFrame(ctx, obj, bounds) {
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)';
                ctx.lineWidth = 1.5 / scale;
                ctx.setLineDash([4 / scale, 4 / scale]);
                
                if (bounds.radius) {
                    ctx.beginPath();
                    ctx.arc(0, 0, bounds.radius + 1.5, 0, Math.PI*2);
                    ctx.stroke();
                } else {
                    ctx.strokeRect(bounds.left - 1, bounds.top - 1, (bounds.right - bounds.left) + 2, (bounds.bottom - bounds.top) + 2);
                }
                ctx.setLineDash([]);

                // 畫旋轉把手
                ctx.beginPath();
                ctx.moveTo(bounds.cx, bounds.cy + 6);
                ctx.lineTo(bounds.cx, bounds.cy);
                ctx.stroke();

                ctx.fillStyle = '#3B82F6';
                ctx.beginPath();
                ctx.arc(bounds.cx, bounds.cy, 3, 0, Math.PI*2);
                ctx.fill();
            }

            function drawAnchorCross(ctx) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.lineWidth = 1 / scale;
                ctx.beginPath();
                ctx.moveTo(-2, 0); ctx.lineTo(2, 0);
                ctx.moveTo(0, -2); ctx.lineTo(0, 2);
                ctx.stroke();
            }

            function drawObjects() {
                fieldObjects.forEach(obj => {
                    ctx.save();
                    ctx.translate(obj.x * scale, obj.y * scale);
                    ctx.rotate(obj.angle * Math.PI / 180);
                    ctx.scale(scale, scale); 

                    if (obj.type === 'yellow') {
                        ctx.fillStyle = 'rgba(234, 179, 8, 0.9)'; 
                        ctx.fillRect(-14, -14, 14, 14);
                    } else if (obj.type === 'blue') {
                        ctx.fillStyle = 'rgba(59, 130, 246, 0.9)';
                        ctx.fillRect(-30, -5, 30, 5);
                    } else if (obj.type === 'red') {
                        ctx.fillStyle = 'rgba(239, 68, 68, 0.9)';
                        ctx.beginPath();
                        ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    drawAnchorCross(ctx);
                    if (obj === selectedObject) drawSelectionFrame(ctx, obj, getObjectBounds(obj));
                    ctx.restore();
                });
            }

            function drawRobot() {
                ctx.save();
                ctx.translate(robot.x * scale, robot.y * scale);
                ctx.rotate(robot.angle * Math.PI / 180);
                ctx.scale(scale, scale); 

                const rw = ROBOT_WIDTH_CM;
                const rh = ROBOT_HEIGHT_CM;
                const cl = CLAW_LENGTH_CM;
                const cw = CLAW_WIDTH_CM;

                ctx.fillStyle = '#4B5563'; 
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 4 / scale; 
                ctx.shadowOffsetY = 2 / scale;
                ctx.fillRect(-rw/2, -rh/2, rw, rh);
                
                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = '#1F2937';
                ctx.lineWidth = 2 / scale;
                ctx.strokeRect(-rw/2, -rh/2, rw, rh);

                // 車頭指示
                ctx.fillStyle = '#60A5FA'; 
                ctx.beginPath();
                ctx.moveTo(0, -rh/2 + 2);
                ctx.lineTo(-4, -rh/2 + 8);
                ctx.lineTo(4, -rh/2 + 8);
                ctx.fill();

                // 夾子
                ctx.fillStyle = '#F59E0B'; 
                ctx.fillRect(-cw/2 - 1.5, -rh/2 - cl, 3, cl); 
                ctx.fillRect(cw/2 - 1.5, -rh/2 - cl, 3, cl);  
                ctx.fillRect(-cw/2 - 1.5, -rh/2 - 3, cw + 3, 3); 

                drawAnchorCross(ctx);
                if (robot === selectedObject) drawSelectionFrame(ctx, robot, getObjectBounds(robot));
                ctx.restore();
            }

            function drawPath() {
                if (pathHistory.length === 0) return;
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)'; 
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                let startPoint = pathHistory[0].start;
                ctx.moveTo(startPoint.x * scale, startPoint.y * scale);
                for (let i = 0; i < pathHistory.length; i++) {
                    ctx.lineTo(pathHistory[i].end.x * scale, pathHistory[i].end.y * scale);
                }
                ctx.stroke();

                ctx.fillStyle = '#059669';
                for (let i = 0; i < pathHistory.length; i++) {
                    ctx.beginPath();
                    ctx.arc(pathHistory[i].end.x * scale, pathHistory[i].end.y * scale, 4, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // --- 控制與記錄 ---
            function renderLogEntry(entryData) {
                const entry = document.createElement('div');
                // 將 flex 排版改為靠左對齊，並加入 gap 控制間距
                entry.className = 'py-1 border-b border-gray-100 last:border-0 hover:bg-gray-100 px-2 flex justify-start items-center gap-3';
                
                const stepNum = entryData.stepNum || (pathHistory.indexOf(entryData) + 1);

                // 縮小編號的預設寬度 (w-6) 並移除右側資訊的 flex-grow 與 justify-end
                entry.innerHTML = `
                    <span class="text-gray-500 font-semibold text-xs w-6">#${stepNum}</span>
                    <span class="flex gap-3">
                        <span>ΔX:<span class="text-blue-600 font-semibold w-8 inline-block text-right">${Math.round(entryData.dx)}</span></span>
                        <span>ΔY:<span class="text-green-600 font-semibold w-8 inline-block text-right">${Math.round(entryData.dy)}</span></span>
                        <span>∠:<span class="text-purple-600 font-semibold w-8 inline-block text-right">${Math.round(entryData.angle)}°</span></span>
                    </span>
                `;

                if (emptyLogMsg) emptyLogMsg.style.display = 'none';
                pathLog.prepend(entry);
                if (pathLog.children.length > 51) pathLog.removeChild(pathLog.lastChild);
            }

            function rebuildAllLogs() {
                pathLog.innerHTML = '<div class="text-gray-400 italic text-center mt-4" id="emptyLogMsg">尚無移動記錄</div>';
                emptyLogMsg = document.getElementById('emptyLogMsg');
                if (pathHistory.length > 0) {
                    emptyLogMsg.style.display = 'none';
                    // 順序渲染，最新記錄會自動置頂 (prepend)
                    for (let i = 0; i < pathHistory.length; i++) {
                        if (!pathHistory[i].stepNum) {
                            pathHistory[i].stepNum = i + 1;
                        }
                        renderLogEntry(pathHistory[i]);
                    }
                }
            }

            // 按鈕事件綁定
            setOriginBtn.addEventListener('click', () => {
                originX = robot.x;
                originY = robot.y;
                lastRecordX = robot.x;
                lastRecordY = robot.y;
                updateDisplays();
            });

            recordBtn.addEventListener('click', () => {
                // 計算與上次記錄點(實體座標)的相對位移
                const dx = robot.x - lastRecordX;
                const dy = lastRecordY - robot.y; 
                
                const stepNum = pathHistory.length + 1;
                
                // 抓取上一次紀錄的結束角度作為這次播放動畫的起始角度
                const startAngle = pathHistory.length > 0 ? pathHistory[pathHistory.length - 1].angle : 0;

                const recordData = {
                    stepNum: stepNum,
                    dx: dx,
                    dy: dy,
                    angle: robot.angle,
                    startAngle: startAngle,
                    start: {x: lastRecordX, y: lastRecordY},
                    end: {x: robot.x, y: robot.y}
                };

                pathHistory.push(recordData);
                renderLogEntry(recordData);

                lastRecordX = robot.x;
                lastRecordY = robot.y;
            });

            resetBtn.addEventListener('click', () => {
                robot.x = fieldWidthCM / 2;
                robot.y = fieldHeightCM / 2;
                robot.angle = 0;
                
                originX = fieldWidthCM;
                originY = fieldHeightCM;
                lastRecordX = originX;
                lastRecordY = originY;
                
                pathHistory = [];
                fieldObjects = [];
                selectedObject = robot;
                
                pathLog.innerHTML = '<div class="text-gray-400 italic text-center mt-4" id="emptyLogMsg">尚無移動記錄</div>';
                emptyLogMsg = document.getElementById('emptyLogMsg');
                updateDisplays();
            });

            clearLogBtn.addEventListener('click', () => {
                pathLog.innerHTML = '<div class="text-gray-400 italic text-center mt-4" id="emptyLogMsg">尚無移動記錄</div>';
                emptyLogMsg = document.getElementById('emptyLogMsg');
                pathHistory = [];
                lastRecordX = robot.x;
                lastRecordY = robot.y;
                
                if (isPlaying) {
                    isPlaying = false;
                    playPathBtn.textContent = '▶ 播放';
                }
            });

            playPathBtn.addEventListener('click', () => {
                if (pathHistory.length === 0) return;
                
                if (isPlaying) {
                    // 中斷播放
                    isPlaying = false;
                    playPathBtn.textContent = '▶ 播放';
                } else {
                    // 開始播放
                    isPlaying = true;
                    playPathBtn.textContent = '⏹ 停止';
                    playIndex = 0;
                    playStartTime = 0;
                    
                    // 將車輛與視角重置至路徑第一步的起點
                    robot.x = pathHistory[0].start.x;
                    robot.y = pathHistory[0].start.y;
                    robot.angle = pathHistory[0].startAngle || 0;
                    
                    selectedObject = robot; // 強制選取機器車以顯示資訊
                    updateDisplays();
                }
            });

            // 匯出紀錄 (JSON格式)
            exportBtn.addEventListener('click', () => {
                const exportData = {
                    gridCols, gridRows,
                    fieldWidthCM, fieldHeightCM,
                    originX, originY,
                    lastRecordX, lastRecordY,
                    robot, fieldObjects, pathHistory
                };
                const jsonStr = JSON.stringify(exportData, null, 2);
                const blob = new Blob([jsonStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `robot_sim_record_${new Date().getTime()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // 匯入紀錄 (讀取JSON)
            importUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        
                        // 恢復場地設定
                        gridCols = data.gridCols || 15;
                        gridRows = data.gridRows || 15;
                        gridColsInput.value = gridCols;
                        gridRowsInput.value = gridRows;
                        fieldWidthCM = data.fieldWidthCM || (gridCols * GRID_SIZE_CM);
                        fieldHeightCM = data.fieldHeightCM || (gridRows * GRID_SIZE_CM);
                        
                        // 恢復參考點
                        originX = data.originX;
                        originY = data.originY;
                        lastRecordX = data.lastRecordX;
                        lastRecordY = data.lastRecordY;
                        
                        // 恢復物件狀態
                        robot = data.robot;
                        fieldObjects = data.fieldObjects || [];
                        pathHistory = data.pathHistory || [];
                        selectedObject = robot; 
                        
                        // 更新畫面
                        rebuildAllLogs();
                        resizeCanvas();
                        updateDisplays();
                        
                    } catch (err) {
                        console.error("匯入失敗，請確認檔案格式是否正確", err);
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; // 歸零 input 以允許重複上傳相同檔案
            });

            applyFieldBtn.addEventListener('click', () => {
                gridCols = Math.max(5, parseInt(gridColsInput.value) || 15);
                gridRows = Math.max(5, parseInt(gridRowsInput.value) || 15);
                gridColsInput.value = gridCols;
                gridRowsInput.value = gridRows;
                
                fieldWidthCM = gridCols * GRID_SIZE_CM;
                fieldHeightCM = gridRows * GRID_SIZE_CM;
                
                originX = fieldWidthCM;
                originY = fieldHeightCM;
                lastRecordX = originX;
                lastRecordY = originY;
                
                resizeCanvas();
                updateDisplays();
            });

            function update(timestamp) {
                // 處理播放動畫
                if (isPlaying) {
                    if (!playStartTime) playStartTime = timestamp;
                    const elapsed = timestamp - playStartTime;
                    const duration = 500; // 每段移動動畫花費 0.5 秒 (500ms)
                    const progress = Math.min(elapsed / duration, 1);
                    
                    const step = pathHistory[playIndex];
                    
                    // X與Y的線性位置插值
                    robot.x = step.start.x + (step.end.x - step.start.x) * progress;
                    robot.y = step.start.y + (step.end.y - step.start.y) * progress;
                    
                    // 最短路徑旋轉角度插值
                    let startAng = step.startAngle || 0;
                    let endAng = step.angle;
                    let diff = endAng - startAng;
                    diff = ((diff + 540) % 360) - 180; 
                    robot.angle = (startAng + diff * progress + 360) % 360;

                    updateDisplays();

                    // 到達當前節點後準備前往下一個
                    if (progress >= 1) {
                        playIndex++;
                        playStartTime = 0;
                        if (playIndex >= pathHistory.length) {
                            isPlaying = false;
                            playPathBtn.textContent = '▶ 播放';
                        }
                    }
                }

                draw();
                requestAnimationFrame(update);
            }

            resizeCanvas();
            updateDisplays();
            requestAnimationFrame(update);
        });
    </script>
</body>
